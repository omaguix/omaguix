# Build the channel's complete reference system, not a machine's package list.
# Export only package outputs and their closure no configured substitute
# server serves.
name: build-desktop
run-name: build-desktop channel ${{ inputs.channel_commit || 'main (resolved at run time)' }}

on:
  push:
    branches: [main]
    paths:
      - scripts/ci-install-guix
      - scripts/desktop-split
      - scripts/reference-system-licenses.scm
      - scripts/static-substitutes
      - scripts/static-tree
      - scripts/verify-substitutes.scm
      - scripts/vps-import
      - tests/**
      - modules/roguix/builder.pub
      - .github/workflows/build-desktop.yml
  workflow_dispatch:
    inputs:
      channel_commit:
        description: omaguix-channel commit (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

env:
  SUBSTITUTE_URLS: >-
    https://bordeaux.guix.gnu.org https://substitutes.omaguix.org

defaults:
  run:
    shell: bash

jobs:
  resolve-channel:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.channel.outputs.commit }}
    steps:
      - name: Resolve the channel commit
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_COMMIT: ${{ inputs.channel_commit }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            commit=$REQUESTED_COMMIT
          else
            commit=$(git ls-remote https://github.com/omaguix/omaguix-channel main | awk '$2 == "refs/heads/main" { print $1 }')
          fi
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid channel commit" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Channel commit: $commit" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve-channel
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            prefix: aarch64-desktop
          - system: x86_64-linux
            runner: ubuntu-24.04
            prefix: x86_64-desktop
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: build-${{ matrix.prefix }}
      cancel-in-progress: false
    env:
      GUIX_SYSTEM: ${{ matrix.system }}
      PREFIX: ${{ matrix.prefix }}
      CHANNEL_COMMIT: ${{ needs.resolve-channel.outputs.commit }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: omaguix/omaguix-channel
          ref: ${{ env.CHANNEL_COMMIT }}
          path: roguix-channel
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the channel keyring
        working-directory: roguix-channel
        run: git fetch origin refs/heads/keyring:refs/remotes/origin/keyring

      - name: Install Guix
        run: scripts/ci-install-guix

      - name: Authenticate the channel
        working-directory: roguix-channel
        run: |
          guix git authenticate --keyring=origin/keyring --end="$CHANNEL_COMMIT" \
            bcc938512706d19de86dd8c6f50853fa80b063b8 \
            '7D1A 8B40 0C26 0998 097F  63E5 28B8 3B16 11FA 815E'

      - name: Read the authenticated reference system's Guix pin
        run: |
          commit=$(cat roguix-channel/modules/roguix/guix-commit)
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Guix pin"; exit 1; }
          echo "GUIX_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "ROGUIX_MODULES=$GITHUB_WORKSPACE/roguix-channel/modules" >> "$GITHUB_ENV"

      # ci-install-guix authorizes bordeaux's key from the binary tarball.
      - name: Trust substitutes.omaguix.org substitutes
        run: |
          guix=$(command -v guix)
          # shellcheck disable=SC2024 # The public key is readable by the runner.
          sudo "$guix" archive --authorize < "$ROGUIX_MODULES/roguix/substitutes.omaguix.org.pub"

      - name: Get the reference system's Guix
        run: |
          guix time-machine --commit="$GUIX_COMMIT" \
            --substitute-urls="$SUBSTITUTE_URLS" -- describe

      - name: Build
        run: |
          guix time-machine --commit="$GUIX_COMMIT" -- \
            system build --no-grafts --system="$GUIX_SYSTEM" \
            --substitute-urls="$SUBSTITUTE_URLS" -L "$ROGUIX_MODULES" \
            -e '(@ (roguix system) %roguix-reference-system)' | tee outputs.txt

      # Grafts are not substitutable. Publish the package outputs the system
      # lowers and their closure, not the files generated for this system.
      - name: Split the closure
        id: split
        run: |
          mkdir split
          printf '%s\n' "$CHANNEL_COMMIT" > split/channel-commit.txt
          printf '%s\n' "$GUIX_COMMIT" > split/guix-commit.txt
          printf '%s\n' "$GUIX_SYSTEM" > split/system.txt
          : > split/release-tag.txt
          guix time-machine --commit="$GUIX_COMMIT" -- \
            repl -L "$ROGUIX_MODULES" -- scripts/reference-system-licenses.scm > split/licenses.txt
          # shellcheck disable=SC2046 # Guix emits whitespace-free store path arguments.
          guix gc -R $(cat outputs.txt) | sort -u > split/closure.txt
          scripts/desktop-split split
          wc -l split/*.txt

      - name: Export
        if: github.ref == 'refs/heads/main'
        env:
          BUILDER_KEY: ${{ secrets.BUILDER_SIGNING_KEY }}
        run: |
          if [ ! -s split/publish.txt ]; then
            echo "bordeaux and substitutes.omaguix.org serve all package items: no export"
            exit 0
          fi
          # Remove the secret even if export fails.
          trap 'sudo rm -f /etc/guix/signing-key.sec' EXIT
          sudo install -m 600 /dev/null /etc/guix/signing-key.sec
          printf '%s\n' "$BUILDER_KEY" | sudo tee /etc/guix/signing-key.sec > /dev/null
          sudo install -m 644 modules/roguix/builder.pub /etc/guix/signing-key.pub
          # shellcheck disable=SC2046 # desktop-split emits whitespace-free store paths.
          guix archive --export $(cat split/publish.txt) | zstd -T0 -12 > "roguix-$PREFIX.nar.zst"
          ls -l "roguix-$PREFIX.nar.zst"

      - name: Upload signing input
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-${{ matrix.prefix }}
          if-no-files-found: error
          compression-level: 0
          path: |
            split/
            outputs.txt
            roguix-${{ matrix.prefix }}.nar.zst

      # A successful split produces all lists, even when publish.txt is empty.
      # Preserve them if export fails, but never upload an incomplete split.
      - name: Upload the split
        if: ${{ always() && steps.split.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: split-${{ matrix.prefix }}
          if-no-files-found: error
          path: |
            split/channel-commit.txt
            split/guix-commit.txt
            split/system.txt
            split/release-tag.txt
            split/publish.txt
            split/vps-fetch.txt
            split/vps-has.txt
            split/package-closure.txt

  sign-substitutes:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner))
    needs: [resolve-channel, build]
    environment: substitute-signing
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        prefix: [x86_64-desktop, aarch64-desktop]
    runs-on: ubuntu-24.04
    concurrency:
      group: sign-${{ matrix.prefix }}
      cancel-in-progress: false
    env:
      PREFIX: ${{ matrix.prefix }}
      CHANNEL_COMMIT: ${{ needs.resolve-channel.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: omaguix/omaguix-channel
          ref: ${{ env.CHANNEL_COMMIT }}
          path: roguix-channel
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signing-${{ matrix.prefix }}
          path: input

      - name: Install Guix and authenticate the channel
        run: |
          scripts/ci-install-guix
          git -C roguix-channel fetch origin refs/heads/keyring:refs/remotes/origin/keyring
          guix="$GUIX_PATH/bin/guix"
          (cd roguix-channel && "$guix" git authenticate --keyring=origin/keyring --end="$CHANNEL_COMMIT" \
            bcc938512706d19de86dd8c6f50853fa80b063b8 \
            '7D1A 8B40 0C26 0998 097F  63E5 28B8 3B16 11FA 815E')
        env:
          GUIX_PATH: /var/guix/profiles/per-user/root/current-guix

      - name: Verify input and prepare the fresh signing store
        id: prepare
        run: |
          pin=7e74121a40a8308166e328a23647cf6f3768e6c8
          # Validate artifact lists before passing their paths to Guix commands.
          for name in publish vps-has vps-fetch package-closure; do
            if grep -qEv '^/gnu/store/[0-9abcdfghijklmnpqrsvwxyz]{32}-[A-Za-z0-9+._?=-]+$' "input/split/$name.txt"; then
              echo "Invalid store path in $name" >&2; exit 1
            fi
          done
          diff -u <(sort -u input/split/{publish,vps-has,vps-fetch}.txt) \
            <(sort -u input/split/package-closure.txt)
          [[ $(< roguix-channel/modules/roguix/guix-commit) == "$pin" ]]
          [[ $(< input/split/guix-commit.txt) == "$pin" ]]
          [[ $(< input/split/channel-commit.txt) == "$CHANNEL_COMMIT" ]]
          case $PREFIX in
            x86_64-desktop) expected=x86_64-linux ;;
            aarch64-desktop) expected=aarch64-linux ;;
          esac
          [[ $(< input/split/system.txt) == "$expected" ]]
          if [[ ! -s input/split/publish.txt ]]; then
            echo "has-export=false" >> "$GITHUB_OUTPUT"
            echo "No new items: preserve the previous release for legacy importers."
            exit 0
          fi
          echo "has-export=true" >> "$GITHUB_OUTPUT"
          key="$GITHUB_WORKSPACE/roguix-channel/modules/roguix/substitutes.omaguix.org.pub"
          # shellcheck disable=SC2024 # Both public keys are runner-readable.
          sudo "$(command -v guix)" archive --authorize < "$key"
          # shellcheck disable=SC2024
          sudo "$(command -v guix)" archive --authorize < modules/roguix/builder.pub
          guix time-machine --commit="$pin" -- describe
          if [[ -s input/split/vps-fetch.txt ]]; then
            xargs -r guix time-machine --commit="$pin" -- build \
              --substitute-urls=https://bordeaux.guix.gnu.org < input/split/vps-fetch.txt
          fi
          if [[ -s input/split/vps-has.txt ]]; then
            xargs -r guix time-machine --commit="$pin" -- build \
              --substitute-urls="$SUBSTITUTE_URLS" < input/split/vps-has.txt
          fi
          if [[ -s input/split/publish.txt ]]; then
            zstd -dc "input/roguix-$PREFIX.nar.zst" | \
              guix time-machine --commit="$pin" -- archive --import
          fi
          tag="$PREFIX-$(date -u +%Y%m%d)-${GITHUB_SHA::7}-${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          python3 -m unittest discover -s tests -v

      - name: Sign and mirror substitutes
        if: steps.prepare.outputs.has-export == 'true'
        env:
          SUBSTITUTE_SIGNING_KEY: ${{ secrets.SUBSTITUTE_SIGNING_KEY }}
        run: |
          scripts/static-substitutes bake --split input/split --output static-release \
            --key roguix-channel/modules/roguix/substitutes.omaguix.org.pub \
            --tag "$RELEASE_TAG" --workflow-commit "$GITHUB_SHA"

      - name: Release the verified tree and compatibility archive
        if: steps.prepare.outputs.has-export == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(static-release/manifest.json static-release/SHA256SUMS static-release/tree-*.tar)
          # Keep old vps-import clients working until the VPS changes its mode.
          if [[ -s input/split/publish.txt ]]; then
            files+=("input/roguix-$PREFIX.nar.zst" input/split/publish.txt input/outputs.txt)
            for f in input/split/vps-fetch.txt input/split/vps-has.txt; do
              if [[ -s $f ]]; then files+=("$f"); fi
            done
          fi
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes "Run $GITHUB_RUN_ID; workflow $GITHUB_SHA; channel $CHANNEL_COMMIT; signed static substitutes ($PREFIX)." \
            "${files[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
